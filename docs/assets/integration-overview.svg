<text x="338" y="660" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Refresh dropdown</text>
<text x="338" y="692" fill="#a4b5cc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Select your checkpoint</text>
<rect x="580" y="580" width="240" height="126" rx="18" fill="#152237"/>
<text x="598" y="621" fill="#72e2ba" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">3</text>
<text x="598" y="660" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Choose settings</text>
<text x="598" y="692" fill="#a4b5cc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Use its settings button</text>
<rect x="840" y="580" width="240" height="126" rx="18" fill="#152237"/>
<text x="858" y="621" fill="#72e2ba" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">4</text>
<text x="858" y="660" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Generate</text>
<text x="858" y="692" fill="#a4b5cc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Watch the image develop</text>
<rect x="1100" y="580" width="240" height="126" rx="18" fill="#152237"/>
<text x="1118" y="621" fill="#72e2ba" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">5</text>
<text x="1118" y="660" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Save / switch</text>
<text x="1118" y="692" fill="#a4b5cc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Native gallery + unload</text>
<rect x="60" y="750" width="1280" height="80" rx="18" fill="#18332e"/>
<text x="86" y="788" fill="#72e2ba" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Current + overall progress   ·   Final image matches saved output   ·   Memory offloading</text>
<text x="60" y="875" fill="#a4b5cc" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Oct 6 validation: 62 tests, including small-model CUDA parity. Full weights need visual validation.</text>
