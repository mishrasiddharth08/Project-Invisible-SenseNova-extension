<text x="60" y="1055" fill="#a4b5cc" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">U1.5 editing is experimental. Looped-DiT: text-to-image only. Hires fix and masks are unsupported.</text>
