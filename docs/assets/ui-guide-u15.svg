<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc"><title id="title">SenseNova U1.5 UI guide</title><desc id="desc">Illustrated current Forge controls; not a screenshot.</desc><rect width="1400" height="1100" fill="#0b1220"/>
